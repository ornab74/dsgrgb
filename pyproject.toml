[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsgrgb-hypercomm"
version = "23.0.0"
description = "Agent Information Economy HyperCommunication runtime with encrypted semantic memory"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "cryptography>=42,<47",
]

[project.optional-dependencies]
weaviate = ["weaviate-client>=4.6,<5"]
he = ["tenseal>=0.3.16"]

[project.scripts]
dsg-hyper = "dsghyper.cli:main"
dsg-secure = "dsghyper.cli:secure_main"

[tool.setuptools.packages.find]
include = ["dsghyper*"]
