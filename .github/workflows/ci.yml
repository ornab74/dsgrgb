name: v21 CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Compile
        run: python -m compileall -q main.py secure_main.py dsghyper tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Standard fallback smoke test
        run: python main.py --rounds 1 "CI bounded communication smoke test"
      - name: Secure ephemeral smoke test
        env:
          DSG_ALLOW_EPHEMERAL_MEMORY: "1"
        run: python secure_main.py --rounds 1 "CI secure memory smoke test"
